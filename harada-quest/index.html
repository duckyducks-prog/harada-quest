<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#F0EDE4">
<title>Harada Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Caveat:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,700;0,9..40,800;1,9..40,400&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #EEE7D9;
      --bg-card: #F8F4ED;
      --text: #1A1A2E;
      --text-secondary: #4A4A5A;
      --text-muted: #8E8E9A;
      --border: #D8D1C4;
      --ink: #1B7CD1;
      --ink-light: #4A9BE5;
      --ink-faint: rgba(27, 124, 209, 0.1);
      --ink-shadow: rgba(27, 124, 209, 0.25);
      --red: #E4483D;
      --red-faint: rgba(228, 72, 61, 0.1);
      --xp-gold: #E4483D;
      --streak-fire: #E4483D;
      --success: #2D8A4E;
      --danger: #E4483D;
      --font-display: 'Space Grotesk', system-ui, sans-serif;
      --font-hand: 'Caveat', cursive;
      --font-body: 'DM Sans', system-ui, sans-serif;
      --radius: 14px;
      --radius-sm: 10px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* Paper texture */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.06;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px;
    }

    h1,
    h2,
    h3 {
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: 90px;
      min-height: 100dvh;
    }

    /* ===== INLINE SVG ICONS ===== */
    .icon-svg {
      display: inline-block;
      vertical-align: middle;
    }

    .icon-svg svg {
      width: 100%;
      height: 100%;
      stroke: var(--ink);
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-svg.filled svg {
      fill: var(--ink);
      stroke: none;
    }

    /* ===== HEADER ===== */
    .header {
      padding: 20px 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title {
      font-family: var(--font-hand);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0;
    }

    .header-level {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--xp-gold);
      background: var(--bg-card);
      padding: 5px 14px;
      border-radius: 20px;
      border: 2px solid var(--xp-gold);
    }

    /* ===== GLOBAL XP BAR ===== */
    .xp-bar-container {
      margin: 14px 20px 0;
      background: var(--border);
      border-radius: 6px;
      height: 8px;
      overflow: hidden;
    }

    .xp-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #E4483D, #C83A30);
      border-radius: 6px;
      transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .xp-label {
      display: flex;
      justify-content: space-between;
      margin: 5px 20px 0;
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ===== VIEWS ===== */
    .view {
      display: none;
      padding: 20px;
    }

    .view.active {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-title {
      font-family: var(--font-hand);
      font-size: 1.2rem;
      color: var(--ink);
      margin-bottom: 14px;
      font-weight: 600;
    }

    /* ===== SWIPEABLE CARD CAROUSEL ===== */
    .carousel-wrapper {
      position: relative;
      margin-bottom: 24px;
    }

    .carousel {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding: 4px 0 16px;
      scrollbar-width: none;
    }

    .carousel::-webkit-scrollbar {
      display: none;
    }

    .area-card {
      flex: 0 0 calc(100% - 40px);
      scroll-snap-align: center;
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 22px;
      border: 2px solid var(--border);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
      min-height: 155px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .area-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--ink);
    }

    .area-card:active {
      transform: scale(0.97);
    }

    .area-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .area-card-icon {
      width: 36px;
      height: 36px;
    }

    .area-card-level-badge {
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 700;
      color: white;
      background: var(--ink);
      padding: 3px 10px;
      border-radius: 10px;
    }

    .area-card-name {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 700;
      margin: 10px 0 3px;
      color: var(--text);
    }

    .area-card-progress-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 10px;
    }

    .area-card-bar {
      height: 5px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .area-card-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s ease;
      background: var(--ink);
    }

    .area-card-tasks-done {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .carousel-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border);
      transition: all 0.3s;
    }

    .carousel-dot.active {
      background: var(--ink);
      width: 18px;
      border-radius: 3px;
    }

    /* ===== MONTHLY PROGRESS BUTTON ===== */
    .monthly-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--font-hand);
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      transition: transform 0.15s;
      margin-bottom: 24px;
    }

    .monthly-btn:active {
      transform: scale(0.97);
    }

    .monthly-btn svg {
      width: 20px;
      height: 20px;
      stroke: var(--ink);
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
    }

    /* ===== AREA DETAIL VIEW ===== */
    .area-detail-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .back-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .back-btn svg {
      width: 16px;
      height: 16px;
      stroke: var(--ink);
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    .back-btn:active {
      transform: scale(0.93);
    }

    .area-detail-title {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .area-detail-title .icon-svg {
      width: 28px;
      height: 28px;
    }

    .area-detail-level {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .area-detail-xp-bar {
      height: 6px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 5px;
    }

    .area-detail-xp-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.6s ease;
      background: var(--ink);
    }

    .area-detail-xp-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    /* ===== MONTHLY OVERVIEW ===== */
    .monthly-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .monthly-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 22px;
      font-family: var(--font-hand);
      font-size: 1rem;
    }

    .monthly-area-row {
      background: var(--bg-card);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin-bottom: 8px;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .monthly-area-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .monthly-area-info {
      flex: 1;
      min-width: 0;
    }

    .monthly-area-name {
      font-family: var(--font-display);
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .monthly-area-bar {
      height: 5px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .monthly-area-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
      background: var(--ink);
    }

    .monthly-area-pct {
      font-family: var(--font-display);
      font-size: 0.82rem;
      font-weight: 700;
      flex-shrink: 0;
      min-width: 36px;
      text-align: right;
      color: var(--ink);
    }

    .monthly-radar-container {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 22px 14px;
      margin-bottom: 18px;
      border: 2px solid var(--border);
    }

    /* ===== TASK CARD ===== */
    .task-card {
      background: var(--bg-card);
      border-radius: var(--radius-sm);
      padding: 13px 15px;
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 2px solid var(--border);
      cursor: pointer;
      transition: transform 0.15s, background 0.2s;
      position: relative;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .task-card:active {
      transform: scale(0.98);
    }

    .task-card.completed {
      background: linear-gradient(135deg, #4A9BE5 0%, #3088D8 30%, #2578C8 50%, #3D90DD 70%, #5AA5E8 100%);
      border-color: #1B7CD1;
      position: relative;
      animation: paintIn 0.5s ease both;
    }

    .task-card.completed::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0.12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 120px;
    }

    .task-card.completed .task-title {
      color: #F0EDE4;
      text-decoration: line-through;
      text-decoration-color: rgba(240, 237, 228, 0.4);
      text-decoration-thickness: 1.5px;
    }

    .task-card.completed .task-freq {
      background: rgba(255, 255, 255, 0.2);
      color: #F0EDE4;
    }

    .task-card.completed .task-xp {
      color: #F0EDE4;
    }

    .task-card.completed .task-streak {
      color: #F0EDE4;
    }

    @keyframes paintIn {
      0% {
        background-size: 0% 100%;
        opacity: 0.7;
      }

      100% {
        background-size: 100% 100%;
        opacity: 1;
      }
    }

    .task-checkbox {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 2.5px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      background: var(--bg);
    }

    .task-card.completed .task-checkbox {
      background: #F0EDE4;
      border-color: #F0EDE4;
      animation: checkBounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .task-checkbox svg {
      width: 13px;
      height: 13px;
      stroke: var(--ink);
      stroke-width: 3;
      fill: none;
      opacity: 0;
      transform: scale(0);
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .task-card.completed .task-checkbox svg {
      opacity: 1;
      transform: scale(1);
    }

    .task-info {
      flex: 1;
      min-width: 0;
    }

    .task-title {
      font-size: 0.85rem;
      font-weight: 500;
      line-height: 1.3;
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 3px;
    }

    .task-freq {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--ink-faint);
      color: var(--ink);
    }

    .task-streak {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--streak-fire);
    }

    .task-xp {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--xp-gold);
      margin-left: auto;
      flex-shrink: 0;
    }

    /* ===== BOSS CARD ===== */
    .boss-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 10px;
      border: 2px solid var(--red);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .boss-label {
      font-family: var(--font-hand);
      font-size: 0.9rem;
      color: var(--red);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .boss-title {
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .boss-power-bar {
      height: 6px;
      background: var(--ink-faint);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 5px;
    }

    .boss-power-fill {
      height: 100%;
      background: var(--red);
      border-radius: 3px;
      transition: width 0.6s ease;
    }

    .boss-power-label {
      font-size: 0.68rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* ===== XP FLOAT ===== */
    .xp-float {
      position: fixed;
      font-family: var(--font-hand);
      font-weight: 700;
      font-size: 1.4rem;
      color: var(--xp-gold);
      pointer-events: none;
      z-index: 1000;
      animation: floatUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      70% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translateY(-80px) scale(1.3);
      }
    }

    @keyframes checkBounce {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.2);
      }

      100% {
        transform: scale(1);
      }
    }

    /* ===== LEVEL UP OVERLAY ===== */
    .level-up-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(240, 237, 228, 0.96);
      backdrop-filter: blur(8px);
      animation: overlayIn 0.5s ease;
      cursor: pointer;
    }

    @keyframes overlayIn {
      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

    .level-up-badge {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      background: var(--ink-faint);
      border: 3px solid var(--ink);
      animation: badgePop 0.6s 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .level-up-badge .icon-svg {
      width: 50px;
      height: 50px;
    }

    @keyframes badgePop {
      0% {
        transform: scale(0) rotate(-20deg);
        opacity: 0;
      }

      100% {
        transform: scale(1) rotate(0);
        opacity: 1;
      }
    }

    .level-up-text {
      font-family: var(--font-hand);
      font-size: 1.2rem;
      color: var(--ink);
      font-weight: 700;
      margin-bottom: 6px;
      animation: textIn 0.4s 0.4s ease both;
    }

    .level-up-level {
      font-family: var(--font-display);
      font-size: 2.8rem;
      font-weight: 700;
      animation: textIn 0.4s 0.5s ease both;
    }

    .level-up-area {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-top: 4px;
      animation: textIn 0.4s 0.6s ease both;
    }

    .level-up-dismiss {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 30px;
      animation: textIn 0.4s 0.8s ease both;
    }

    @keyframes textIn {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--bg-card);
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      padding: 10px 18px;
      font-family: var(--font-hand);
      font-weight: 600;
      font-size: 1rem;
      color: var(--ink);
      z-index: 1500;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
      white-space: nowrap;
      animation: toastIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, toastOut 0.3s 2.5s ease forwards;
    }

    @keyframes toastIn {
      0% {
        transform: translateX(-50%) translateY(-100px);
      }

      100% {
        transform: translateX(-50%) translateY(0);
      }
    }

    @keyframes toastOut {
      0% {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }

      100% {
        transform: translateX(-50%) translateY(-100px);
        opacity: 0;
      }
    }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border-top: 2px solid var(--border);
      display: flex;
      justify-content: center;
      padding: 6px 0;
      padding-bottom: max(6px, env(safe-area-inset-bottom));
      z-index: 100;
    }

    .nav-item {
      flex: 1;
      max-width: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 7px 0;
      cursor: pointer;
      color: var(--text-muted);
      transition: color 0.2s;
      background: none;
      border: none;
      font-family: var(--font-body);
    }

    .nav-item.active {
      color: var(--ink);
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-item.active svg {
      stroke-width: 2.8;
    }

    .nav-label {
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ===== STATS ===== */
    .stat-row {
      display: flex;
      justify-content: space-between;
      background: var(--bg-card);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin-bottom: 7px;
      border: 2px solid var(--border);
    }

    .stat-label {
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    .stat-value {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.05rem;
    }

    .heatmap {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      margin-top: 10px;
    }

    .heatmap-cell {
      aspect-ratio: 1;
      border-radius: 3px;
      background: var(--border);
    }

    .heatmap-cell.l1 {
      background: #C2DBF0;
    }

    .heatmap-cell.l2 {
      background: #7AB5E3;
    }

    .heatmap-cell.l3 {
      background: #3D94D6;
    }

    .heatmap-cell.l4 {
      background: var(--ink);
    }

    .streak-card {
      background: var(--bg-card);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      margin-bottom: 7px;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .streak-fire-icon {
      font-size: 1.2rem;
      animation: firePulse 1.5s ease-in-out infinite;
    }

    @keyframes firePulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }
    }

    .streak-info {
      flex: 1;
    }

    .streak-task-name {
      font-size: 0.78rem;
      font-weight: 500;
    }

    .streak-count {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1rem;
      color: var(--red);
    }

    .streak-mult {
      font-size: 0.68rem;
      font-weight: 700;
      background: var(--ink-faint);
      color: var(--ink);
      padding: 2px 7px;
      border-radius: 5px;
    }

    /* ===== DESKTOP LAYOUT ===== */
    .app-desktop {
      display: none;
    }

    @media (min-width: 768px) {
      .app {
        display: none;
      }

      .bottom-nav {
        display: none;
      }

      .app-desktop {
        display: block;
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 32px 40px;
      }

      .desktop-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .desktop-header .header-title {
        font-size: 1.8rem;
      }

      .desktop-xp-section {
        margin-bottom: 28px;
      }

      .desktop-xp-section .xp-bar-container {
        margin: 12px 0 0;
      }

      .desktop-xp-section .xp-label {
        margin: 6px 0 0;
      }

      .desktop-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 24px;
        align-items: start;
      }

      .desktop-col {
        min-width: 0;
      }

      .desktop-col-title {
        font-family: var(--font-hand);
        font-size: 1.3rem;
        font-weight: 600;
        margin-bottom: 14px;
        color: var(--ink);
      }

      .desktop-area-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
        margin-bottom: 18px;
      }

      .desktop-area-card {
        background: var(--bg-card);
        border-radius: var(--radius-sm);
        padding: 13px;
        border: 2px solid var(--border);
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
        position: relative;
        overflow: hidden;
      }

      .desktop-area-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--ink);
      }

      .desktop-area-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 14px rgba(27, 124, 209, 0.1);
      }

      .desktop-area-card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 5px;
      }

      .desktop-area-card-icon {
        width: 22px;
        height: 22px;
      }

      .desktop-area-card-lv {
        font-family: var(--font-display);
        font-size: 0.62rem;
        font-weight: 700;
        color: white;
        background: var(--ink);
        padding: 2px 7px;
        border-radius: 7px;
      }

      .desktop-area-card-name {
        font-family: var(--font-display);
        font-size: 0.78rem;
        font-weight: 700;
        margin-bottom: 5px;
      }

      .desktop-area-card-bar {
        height: 4px;
        background: var(--border);
        border-radius: 3px;
        overflow: hidden;
      }

      .desktop-area-card-bar-fill {
        height: 100%;
        border-radius: 3px;
        background: var(--ink);
      }

      .desktop-area-card-meta {
        font-size: 0.65rem;
        color: var(--text-muted);
        margin-top: 5px;
      }

      .desktop-radar {
        background: var(--bg-card);
        border-radius: var(--radius);
        padding: 18px 14px;
        margin-bottom: 18px;
        border: 2px solid var(--border);
      }

      .desktop-tasks-scroll {
        max-height: calc(100vh - 180px);
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
        padding-right: 4px;
      }

      .desktop-tasks-scroll::-webkit-scrollbar {
        width: 4px;
      }

      .desktop-tasks-scroll::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }

      .desktop-stats-card {
        background: var(--bg-card);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 14px;
        border: 2px solid var(--border);
      }

      .desktop-stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
        margin-bottom: 14px;
      }

      .desktop-stat-item {
        text-align: center;
        padding: 10px 6px;
        background: var(--bg);
        border-radius: var(--radius-sm);
      }

      .desktop-stat-value {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.2rem;
        display: block;
      }

      .desktop-stat-label {
        font-size: 0.65rem;
        color: var(--text-muted);
        margin-top: 2px;
      }

      .desktop-area-detail {
        display: none;
      }

      .desktop-area-detail.active {
        display: block;
      }

      .desktop-checkin {
        display: block;
      }

      .desktop-checkin.hidden {
        display: none;
      }
    }

    @media (min-width: 1100px) {
      .desktop-grid {
        gap: 32px;
      }
    }

    /* ===== CHECK-IN SUB-TABS ===== */
    .checkin-tab {
      flex: 1;
      padding: 10px 0;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      position: relative;
      transition: color 0.2s;
      font-family: var(--font-body);
    }

    .checkin-tab.active {
      color: var(--ink);
    }

    .checkin-tab.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 10%;
      right: 10%;
      height: 3px;
      background: var(--ink);
      border-radius: 2px;
    }

    /* ===== SETTINGS FULL SCREEN ===== */
    .settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: var(--bg);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      animation: overlayIn 0.3s ease;
    }

    .settings-inner {
      max-width: 520px;
      margin: 0 auto;
      padding: 20px 20px 40px;
    }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .settings-title {
      font-family: var(--font-hand);
      font-size: 1.6rem;
      color: var(--ink);
      font-weight: 700;
    }

    .settings-close {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .settings-close:active {
      transform: scale(0.93);
    }

    .settings-close svg {
      width: 16px;
      height: 16px;
      stroke: var(--text-muted);
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    .settings-section {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
    }

    .settings-section-title {
      font-family: var(--font-hand);
      font-size: 1.15rem;
      color: var(--ink);
      font-weight: 700;
      margin-bottom: 12px;
    }

    .settings-label {
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .settings-input {
      width: 100%;
      padding: 9px 12px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 0.82rem;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    .settings-input:focus {
      border-color: var(--ink);
    }

    .settings-input::placeholder {
      color: var(--text-muted);
    }

    .settings-input-sm {
      padding: 7px 10px;
      font-size: 0.78rem;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      outline: none;
      width: 100%;
    }

    .settings-input-sm:focus {
      border-color: var(--ink);
    }

    .settings-desc {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-top: 4px;
    }

    .settings-btns {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .settings-btn {
      flex: 1;
      padding: 10px;
      border-radius: var(--radius-sm);
      border: 2px solid var(--border);
      font-family: var(--font-display);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      background: var(--bg-card);
      color: var(--text);
    }

    .settings-btn.primary {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
    }

    .settings-btn.primary:active {
      transform: scale(0.97);
    }

    .settings-btn.danger {
      color: var(--red);
      border-color: var(--red);
    }

    .settings-status {
      font-size: 0.72rem;
      margin-top: 10px;
      font-weight: 500;
    }

    .settings-status.ok {
      color: var(--success);
    }

    .settings-status.err {
      color: var(--red);
    }

    /* Area accordion in settings */
    .settings-area-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .settings-area-row:last-child {
      border-bottom: none;
    }

    .settings-area-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .settings-area-name {
      font-family: var(--font-display);
      font-size: 0.82rem;
      font-weight: 700;
      flex: 1;
    }

    .settings-area-chevron {
      width: 16px;
      height: 16px;
      stroke: var(--text-muted);
      fill: none;
      stroke-width: 2.5;
      transition: transform 0.2s;
    }

    .settings-area-chevron.open {
      transform: rotate(90deg);
    }

    .settings-area-tasks {
      display: none;
      padding: 10px 0 6px 32px;
    }

    .settings-area-tasks.open {
      display: block;
    }

    .settings-task-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .settings-task-row input {
      flex: 1;
    }

    .settings-task-freq {
      width: 90px;
      padding: 7px 6px;
      font-size: 0.72rem;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      outline: none;
    }

    .settings-task-xp {
      width: 50px;
      padding: 7px 6px;
      font-size: 0.72rem;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      outline: none;
      text-align: center;
    }

    /* Settings gear button */
    .settings-gear {
      width: 28px;
      height: 28px;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.2s;
      margin-right: 10px;
    }

    .settings-gear:hover,
    .settings-gear:active {
      opacity: 1;
    }

    .settings-gear svg {
      width: 100%;
      height: 100%;
      stroke: var(--text-muted);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ===== COACH SIDE PANEL ===== */
    .coach-panel-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1500;
      background: rgba(0, 0, 0, 0.3);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .coach-panel-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .coach-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 1501;
      width: 380px;
      max-width: 90vw;
      background: var(--bg);
      border-left: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .coach-panel.open {
      transform: translateX(0);
    }

    .coach-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 2px solid var(--border);
      background: var(--bg-card);
      flex-shrink: 0;
    }

    .coach-panel-title {
      font-family: var(--font-hand);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--ink);
    }

    .coach-panel-close {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 2px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .coach-panel-close:active {
      transform: scale(0.93);
    }

    .coach-panel-close svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-muted);
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    .coach-panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .coach-panel-body::-webkit-scrollbar {
      width: 4px;
    }

    .coach-panel-body::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .coach-panel-input {
      padding: 12px 18px;
      border-top: 2px solid var(--border);
      background: var(--bg-card);
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .coach-panel-input input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 0.85rem;
      background: var(--bg);
      color: var(--text);
      outline: none;
    }

    .coach-panel-input input:focus {
      border-color: var(--ink);
    }

    .coach-panel-input input::placeholder {
      color: var(--text-muted);
    }

    .coach-send-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      background: var(--ink);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .coach-send-btn:active {
      transform: scale(0.93);
    }

    .coach-send-btn svg {
      width: 16px;
      height: 16px;
      stroke: white;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* FAB (floating action button) */
    .coach-fab {
      position: fixed;
      bottom: 90px;
      right: 18px;
      z-index: 100;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--ink);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px var(--ink-shadow);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .coach-fab:active {
      transform: scale(0.93);
    }

    .coach-fab:hover {
      box-shadow: 0 6px 24px var(--ink-shadow);
    }

    .coach-fab svg {
      width: 24px;
      height: 24px;
      stroke: white;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (min-width: 768px) {
      .coach-fab {
        bottom: 24px;
        right: 24px;
      }
    }

    /* Chat bubbles */
    .coach-chat {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .coach-bubble {
      max-width: 90%;
      padding: 12px 15px;
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--text);
      animation: bubbleIn 0.3s ease both;
    }

    .coach-bubble.coach-msg {
      align-self: flex-start;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 2px var(--radius) var(--radius) var(--radius);
    }

    .coach-bubble.coach-msg:nth-child(2) {
      animation-delay: 0.15s;
    }

    .coach-bubble.coach-msg:nth-child(3) {
      animation-delay: 0.3s;
    }

    .coach-bubble.user-msg {
      align-self: flex-end;
      background: var(--ink);
      color: white;
      border-radius: var(--radius) 2px var(--radius) var(--radius);
    }

    @keyframes bubbleIn {
      0% {
        opacity: 0;
        transform: translateY(8px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .coach-empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
    }

    .coach-empty-icon {
      margin-bottom: 14px;
    }

    .coach-empty-title {
      font-family: var(--font-hand);
      font-size: 1.2rem;
      color: var(--text-secondary);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .coach-empty-desc {
      font-size: 0.82rem;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    .coach-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px;
      background: var(--ink);
      border: none;
      border-radius: var(--radius);
      font-family: var(--font-hand);
      font-size: 1rem;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .coach-btn:active {
      transform: scale(0.97);
    }

    .coach-new-btn {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      font-family: var(--font-body);
      text-decoration: underline;
    }

    .coach-new-btn:hover {
      color: var(--ink);
    }

    /* Loading dots */
    .coach-loading {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 4px 0;
    }

    .coach-loading-dots {
      display: flex;
      gap: 5px;
      padding: 12px 18px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 2px var(--radius) var(--radius) var(--radius);
    }

    .coach-loading-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ink);
      animation: coachPulse 1.4s infinite ease-in-out both;
    }

    .coach-loading-dot:nth-child(1) {
      animation-delay: -0.32s;
    }

    .coach-loading-dot:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes coachPulse {

      0%,
      80%,
      100% {
        transform: scale(0.4);
        opacity: 0.4;
      }

      40% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>

<body>

    // ===== DATE UTILS =====
    function getPeriodKey(freq, d = new Date()) {
      const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
      if (freq === 'daily') return `${y}-${m}-${day}`;
      if (freq === 'weekly') { const j = new Date(y, 0, 1); const days = Math.floor((d - j) / 864e5); return `${y}-W${String(Math.ceil((days + j.getDay() + 1) / 7)).padStart(2, '0')}`; }
      if (freq === 'monthly') return `${y}-${m}`;
      if (freq === 'quarterly') return `${y}-Q${Math.ceil((d.getMonth() + 1) / 3)}`;
      return `${y}-${m}-${day}`;
    }
    function getPrevPeriod(freq, key) {
      if (freq === 'daily') { const d = new Date(key); d.setDate(d.getDate() - 1); return getPeriodKey('daily', d); }
      if (freq === 'weekly') { const [y, w] = key.split('-W').map(Number); return w <= 1 ? `${y - 1}-W52` : `${y}-W${String(w - 1).padStart(2, '0')}`; }
      if (freq === 'monthly') { const [y, m] = key.split('-').map(Number); return m <= 1 ? `${y - 1}-12` : `${y}-${String(m - 1).padStart(2, '0')}`; }
      if (freq === 'quarterly') { const [y, q] = key.replace('Q', '').split('-').map(Number); return q <= 1 ? `${y - 1}-Q4` : `${y}-Q${q - 1}`; }
    }
    function isCompleted(taskId, freq) { return !!state.completions[`${taskId}:${getPeriodKey(freq)}`]; }

    // ===== XP =====
    function xpForLevel(l) { return l <= 1 ? 0 : Math.floor(50 * Math.pow(l, 1.5)); }
    function getLevel(xp) { let l = 1; while (xpForLevel(l + 1) <= xp) l++; return l; }
    function getLevelProgress(xp) { const l = getLevel(xp); return (xp - xpForLevel(l)) / (xpForLevel(l + 1) - xpForLevel(l)); }
    function getOverallLevel() { return Math.floor(AREAS.map(a => getLevel(state.areaXP[a.id] || 0)).reduce((s, l) => s + l, 0) / AREAS.length); }
    function getMultiplier(s) { return s >= 30 ? 2 : s >= 14 ? 1.75 : s >= 7 ? 1.5 : s >= 3 ? 1.25 : 1; }

    // ===== COMPLETE TASK =====
    function completeTask(taskId, cardEl) {
      const task = TASKS.find(t => t.id === taskId); if (!task) return;
      const period = getPeriodKey(task.frequency); const ck = `${taskId}:${period}`;
      if (state.completions[ck]) {
        delete state.completions[ck];
        const sk = state.streaks[taskId] || { current: 0 }; const m = getMultiplier(sk.current); const xp = Math.round(task.baseXP * m);
        state.totalXP = Math.max(0, state.totalXP - xp); state.areaXP[task.areaId] = Math.max(0, (state.areaXP[task.areaId] || 0) - xp);
        saveState(); updateUI(); return;
      }
      if (!state.streaks[taskId]) state.streaks[taskId] = { current: 0, longest: 0, lastPeriod: null };
      const sk = state.streaks[taskId]; const prev = getPrevPeriod(task.frequency, period);
      if (sk.lastPeriod === prev) sk.current++; else if (sk.lastPeriod !== period) sk.current = 1;
      sk.lastPeriod = period; sk.longest = Math.max(sk.longest, sk.current);
      const mult = getMultiplier(sk.current); const earned = Math.round(task.baseXP * mult);
      const oldLevel = getLevel(state.areaXP[task.areaId] || 0);
      state.completions[ck] = Date.now(); state.totalXP += earned; state.areaXP[task.areaId] = (state.areaXP[task.areaId] || 0) + earned;
      saveState();
      showXPFloat(cardEl, earned, mult);
      if ([3, 7, 14, 30].includes(sk.current)) showToast(`${sk.current}-streak! ${mult}x multiplier`);
      const newLevel = getLevel(state.areaXP[task.areaId]);
      if (newLevel > oldLevel) { const area = AREAS.find(a => a.id === task.areaId); setTimeout(() => showLevelUp(area, newLevel), 600); }
      if (navigator.vibrate) navigator.vibrate(30);
      updateUI();
    }

    // ===== ANIMATIONS =====
    function showXPFloat(el, xp, mult) {
      const r = el.getBoundingClientRect(); const f = document.createElement('div');
      f.className = 'xp-float'; f.textContent = mult > 1 ? `+${xp} XP (${mult}x)` : `+${xp} XP`;
      f.style.left = `${r.right - 60}px`; f.style.top = `${r.top}px`;
      document.body.appendChild(f); setTimeout(() => f.remove(), 1300);
    }
    function showToast(msg) {
      const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
      document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
    }
    function showLevelUp(area, level) {
      const o = document.createElement('div'); o.className = 'level-up-overlay';
      o.innerHTML = `<div class="level-up-badge">${icon(area.iconKey, 50)}</div>
    <div class="level-up-text">Level Up!</div><div class="level-up-level">Level ${level}</div>
    <div class="level-up-area">${area.name}</div><div class="level-up-dismiss">tap to continue</div>`;
      o.addEventListener('click', () => o.remove()); document.body.appendChild(o);
      if (navigator.vibrate) navigator.vibrate([50, 30, 100]);
    }

    // ===== HELPERS =====
    function getAreaCompletion(areaId) {
      const tasks = TASKS.filter(t => t.areaId === areaId);
      const done = tasks.filter(t => isCompleted(t.id, t.frequency)).length;
      return { done, total: tasks.length, pct: tasks.length ? Math.round(done / tasks.length * 100) : 0 };
    }

    // ===== RENDER =====
    function isDesktop() { return window.innerWidth >= 768; }
    function updateUI() {
      updateGlobalBar();
      if (isDesktop()) renderDesktop();
      else {
        const active = document.querySelector('.view.active');
        if (active) {
          if (active.id === 'view-dashboard') renderDashboard();
          else if (active.id === 'view-checkin') renderCheckin();
          else if (active.id === 'view-stats') renderStats();
          else if (active.id === 'view-area-detail') renderAreaDetail(active.dataset.areaId);
          else if (active.id === 'view-monthly') renderMonthly();
        }
      }
    }
    function updateGlobalBar() {
      const l = getOverallLevel(); const p = getLevelProgress(state.totalXP);
      const goal = state.mainGoal || 'Set your main goal';
      document.getElementById('globalLevel').textContent = `LV ${l}`;
      document.getElementById('globalXpBar').style.width = `${Math.min(100, p * 100)}%`;
      document.getElementById('xpCurrent').textContent = `${state.totalXP} XP`;
      document.getElementById('xpNext').textContent = `${xpForLevel(l + 1) - state.totalXP} XP to Lv ${l + 1}`;
      const mg = document.getElementById('mainGoal'); if (mg) mg.textContent = `"${goal}"`;
      const ld = document.getElementById('globalLevelD');
      if (ld) {
        ld.textContent = `LV ${l}`; document.getElementById('globalXpBarD').style.width = `${Math.min(100, p * 100)}%`;
        document.getElementById('xpCurrentD').textContent = `${state.totalXP} XP`;
        document.getElementById('xpNextD').textContent = `${xpForLevel(l + 1) - state.totalXP} XP to Lv ${l + 1}`;
        const mgd = document.getElementById('mainGoalD'); if (mgd) mgd.textContent = `"${goal}"`;
      }
    }

    // Helper: render task card HTML
    function taskCardHTML(task, areaColor) {
      const completed = isCompleted(task.id, task.frequency);
      const sk = state.streaks[task.id]; const sc = sk ? sk.current : 0; const m = getMultiplier(sc); const xp = Math.round(task.baseXP * m);
      return `<div class="task-card ${completed ? 'completed' : ''}" onclick="completeTask('${task.id}',this)"
    ${task.isBoss ? `style="border-left:3px solid var(--ink)"` : ''}>

    // Helper: area tasks grouped HTML
    function areaTasksGroupHTML(areas_list, mode) {
      return areas_list.map(area => {
        let tasks;
        if (mode === 'daily') {
          tasks = TASKS.filter(t => t.areaId === area.id && t.frequency === 'daily');
        } else if (mode === 'pending') {
          tasks = TASKS.filter(t => t.areaId === area.id && t.frequency !== 'daily' && !isCompleted(t.id, t.frequency));
        } else {
          tasks = TASKS.filter(t => t.areaId === area.id);
        }
        if (!tasks.length) return '';
        const done = tasks.filter(t => isCompleted(t.id, t.frequency)).length;
        return `<div style="margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        ${icon(area.iconKey, 16)}
        <div style="font-family:var(--font-display);font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-secondary)">${area.name}</div>
        <div style="font-size:0.68rem;color:var(--text-muted);margin-left:auto">${done}/${tasks.length}</div>
      </div>
      ${tasks.map(t => taskCardHTML(t, area.color)).join('')}
    </div>`;
      }).join('');
    }

    // Helper: boss list HTML
    function bossListHTML(containerId) {
      const bossTasks = TASKS.filter(t => t.isBoss && !isCompleted(t.id, t.frequency)).slice(0, 3);
      if (!bossTasks.length) return '<p style="color:var(--text-muted);font-size:0.82rem;">All bosses defeated!</p>';
      return bossTasks.map(boss => {
        const area = AREAS.find(a => a.id === boss.areaId);
        const nonBoss = TASKS.filter(t => t.areaId === boss.areaId && !t.isBoss);
        const done = nonBoss.filter(t => isCompleted(t.id, t.frequency)).length;
        const req = Math.ceil(nonBoss.length * 0.75); const powered = done >= req;
        return `<div class="boss-card" onclick="${powered ? `completeTask('${boss.id}',this)` : ''}">
      <div class="boss-label">~ Boss — ${area.name}</div>
      <div class="boss-title">${boss.title}</div>
      <div class="boss-power-bar"><div class="boss-power-fill" style="width:${Math.min(100, done / req * 100)}%"></div></div>
      <div class="boss-power-label">${powered ? 'Powered up! Tap to fight!' : `Power up: ${done}/${req} tasks`}</div>
    </div>`;
      }).join('');

    }

    function showDesktopAreaDetail(areaId) {
      const area = AREAS.find(a => a.id === areaId); if (!area) return;
      const xp = state.areaXP[areaId] || 0; const level = getLevel(xp); const progress = getLevelProgress(xp);
      const tasks = TASKS.filter(t => t.areaId === areaId);
      const panel = document.getElementById('desktopAreaDetail');
      document.getElementById('desktopCheckin').classList.add('hidden'); panel.classList.add('active');
      panel.innerHTML = `<div class="area-detail-header"><div class="back-btn" onclick="closeDesktopAreaDetail()">
    <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></div>
    <div><div class="area-detail-title">${icon(area.iconKey, 28)} ${area.name}</div>
    <div class="area-detail-level">Level ${level} · ${xp} XP</div></div></div>
    <div class="area-detail-xp-bar"><div class="area-detail-xp-bar-fill" style="width:${progress * 100}%"></div></div>
    <div class="area-detail-xp-label">${xpForLevel(level + 1) - xp} XP to Level ${level + 1}</div>
    <div class="desktop-tasks-scroll">${tasks.map(t => taskCardHTML(t, area.color)).join('')}</div>`;
    }
    function closeDesktopAreaDetail() { document.getElementById('desktopAreaDetail').classList.remove('active'); document.getElementById('desktopCheckin').classList.remove('hidden'); }

    window.addEventListener('resize', () => updateUI());

    // ===== NAVIGATION =====
    function hideAllViews() { document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); }
    function switchView(viewId) {
      hideAllViews(); document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(`view-${viewId}`).classList.add('active');
      const nb = document.querySelector(`[data-view="${viewId}"]`); if (nb) nb.classList.add('active');
      updateUI();
    }
    document.querySelectorAll('.nav-item').forEach(btn => btn.addEventListener('click', () => switchView(btn.dataset.view)));

    // ===== SETTINGS =====
    const API_KEY_STORE = 'harada-quest-api-key';
    const COACH_CACHE_KEY = 'harada-quest-coach-cache';

    function getApiKey() { return localStorage.getItem(API_KEY_STORE) || ''; }
    function saveApiKey(key) { localStorage.setItem(API_KEY_STORE, key); }
    function deleteApiKey() { localStorage.removeItem(API_KEY_STORE); }

    function showSettings() {
      const key = getApiKey();
      const masked = key ? '••••••••' + key.slice(-8) : '';
      const goal = state.mainGoal || '';
      const overlay = document.createElement('div');
      overlay.className = 'settings-overlay';

      // Build areas + tasks sections
      const areasHTML = AREAS.map((area, ai) => {
        const tasks = TASKS.filter(t => t.areaId === area.id);
        return `<div>
      <div class="settings-area-row" onclick="this.querySelector('.settings-area-chevron').classList.toggle('open');this.nextElementSibling.classList.toggle('open')">
        <div class="settings-area-icon">${icon(area.iconKey, 22)}</div>
        <div class="settings-area-name">${area.name}</div>
        <svg class="settings-area-chevron" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <div class="settings-area-tasks">
        <div style="margin-bottom:8px">
          <div class="settings-label">Area Name</div>
          <input class="settings-input-sm" data-area-idx="${ai}" data-field="name" value="${area.name}" />
        </div>
        <div class="settings-label" style="margin-top:10px">Tasks</div>
        ${tasks.map((t, ti) => `<div class="settings-task-row">
          <input class="settings-input-sm" data-task-id="${t.id}" data-field="title" value="${t.title}" />
          <select class="settings-task-freq" data-task-id="${t.id}" data-field="frequency">
            <option value="daily" ${t.frequency === 'daily' ? 'selected' : ''}>Daily</option>
            <option value="weekly" ${t.frequency === 'weekly' ? 'selected' : ''}>Weekly</option>
            <option value="monthly" ${t.frequency === 'monthly' ? 'selected' : ''}>Monthly</option>
            <option value="quarterly" ${t.frequency === 'quarterly' ? 'selected' : ''}>Quarterly</option>
          </select>
        </div>`).join('')}
      </div>
    </div>`;
      }).join('');

      overlay.innerHTML = `<div class="settings-inner">
    <div class="settings-header">
      <div class="settings-title">Settings</div>
      <div class="settings-close" onclick="this.closest('.settings-overlay').remove()">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-section-title">Main Goal</div>
      <input class="settings-input" id="settingsGoalInput" type="text" placeholder="Your main Harada goal..." value="${goal}" />
      <div class="settings-desc">The center of your Harada grid — what everything feeds into.</div>
    </div>

    <div class="settings-section">
      <div class="settings-section-title">Areas & Tasks</div>
      <div class="settings-desc" style="margin-bottom:12px">Tap an area to edit its name and tasks.</div>
      ${areasHTML}
    </div>

    <div class="settings-section">
      <div class="settings-section-title">Sensei</div>
      <div class="settings-label">API Key</div>
      <input class="settings-input" id="settingsKeyInput" type="password" placeholder="sk-ant-..." value="${key}" />
      ${key ? `<div class="settings-desc">Current: ${masked}</div>` : ''}
      <div class="settings-desc">Your key is stored only on this device. Each request ~$0.01.</div>
      <div id="settingsStatus"></div>
    </div>

    <div class="settings-btns">
      <button class="settings-btn" onclick="this.closest('.settings-overlay').remove()">Cancel</button>
      <button class="settings-btn primary" onclick="handleSaveSettings()">Save All</button>
    </div>

    <div class="settings-section" style="margin-top:14px;border-color:var(--red)">
      <div class="settings-section-title" style="color:var(--red)">Danger Zone</div>
      <div class="settings-btns" style="margin-top:0">
        <button class="settings-btn danger" onclick="if(confirm('Reset all XP, streaks, and completions? Cannot be undone.')){state.totalXP=0;state.areaXP=Object.fromEntries(AREAS.map(a=>[a.id,0]));state.completions={};state.streaks={};state.bossesDefeated=[];saveState();updateUI();this.closest('.settings-overlay').remove();showToast('Progress reset')}">Reset Progress</button>
        <button class="settings-btn danger" onclick="if(confirm('Delete ALL data? Cannot be undone.')){localStorage.clear();location.reload()}">Reset Everything</button>
      </div>
    </div>
  </div>`;
      document.body.appendChild(overlay);
    }

    async function handleSaveSettings() {
      const goalInput = document.getElementById('settingsGoalInput');
      const keyInput = document.getElementById('settingsKeyInput');
      const status = document.getElementById('settingsStatus');
      const goal = goalInput?.value.trim();
      const key = keyInput?.value.trim();

      // Save goal
      if (goal) { state.mainGoal = goal; saveState(); }

      // Save area name changes
      document.querySelectorAll('[data-area-idx][data-field="name"]').forEach(input => {
        const idx = parseInt(input.dataset.areaIdx);
        if (AREAS[idx] && input.value.trim()) {
          AREAS[idx].name = input.value.trim();
        }
      });

      // Save task changes
      document.querySelectorAll('[data-task-id][data-field="title"]').forEach(input => {
        const task = TASKS.find(t => t.id === input.dataset.taskId);
        if (task && input.value.trim()) task.title = input.value.trim();
      });
      document.querySelectorAll('[data-task-id][data-field="frequency"]').forEach(select => {
        const task = TASKS.find(t => t.id === select.dataset.taskId);
        if (task) task.frequency = select.value;
      });

      // Persist custom areas/tasks to localStorage
      localStorage.setItem('harada-quest-areas', JSON.stringify(AREAS));
      localStorage.setItem('harada-quest-tasks', JSON.stringify(TASKS));

      // Save/validate API key
      if (key && key !== getApiKey()) {
        status.className = 'settings-status'; status.textContent = 'Validating API key...';
        try {
          const resp = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true', 'content-type': 'application/json' },
            body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 10, messages: [{ role: 'user', content: 'Say OK' }] })
          });
          if (resp.ok) {
            saveApiKey(key);
            status.className = 'settings-status ok'; status.textContent = 'Saved!';
            setTimeout(() => { document.querySelector('.settings-overlay')?.remove(); updateUI(); }, 800);
          } else {
            const err = await resp.json().catch(() => ({}));
            status.className = 'settings-status err'; status.textContent = err.error?.message || `Error: ${resp.status}`;
          }
          return;
        } catch (e) {
          status.className = 'settings-status err'; status.textContent = 'Network error.';
          return;
        }
      }

      // No key change, just close
      document.querySelector('.settings-overlay')?.remove();
      updateUI();
      showToast('Settings saved');
    }

    // ===== COACH: CONVERSATION =====
    const COACH_HISTORY_KEY = 'harada-quest-coach-history';
    function getCoachHistory() { try { const h = localStorage.getItem(COACH_HISTORY_KEY); return h ? JSON.parse(h) : []; } catch (e) { return []; } }
    function saveCoachHistory(h) { localStorage.setItem(COACH_HISTORY_KEY, JSON.stringify(h)); }

    // ===== COACH: DATA GATHERING =====
    function gatherCoachingData() {
      const now = new Date();
      const areas = AREAS.map(area => {
        const tasks = TASKS.filter(t => t.areaId === area.id);
        const comp = getAreaCompletion(area.id);
        const level = getLevel(state.areaXP[area.id] || 0);
        const taskDetails = tasks.map(t => {
          const sk = state.streaks[t.id];
          return {
            task: t.title, frequency: t.frequency,
            completed: isCompleted(t.id, t.frequency),
            isBoss: !!t.isBoss,
            currentStreak: sk ? sk.current : 0,
            longestStreak: sk ? sk.longest : 0,
          };
        });
        return { name: area.name, level, completionPct: comp.pct, tasksDone: comp.done, tasksTotal: comp.total, tasks: taskDetails };
      });

      // Last 14 days activity
      const last14 = [];
      for (let i = 13; i >= 0; i--) {
        const d = new Date(); d.setDate(d.getDate() - i);
        const k = getPeriodKey('daily', d);
        const cnt = Object.keys(state.completions).filter(c => c.endsWith(':' + k)).length;
        last14.push({ date: k, count: cnt });
      }

      // Calculate urgency: uncompleted tasks running out of time
      const daysLeftInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate() - now.getDate();
      const dayOfWeek = now.getDay(); // 0=Sun
      const daysLeftInWeek = dayOfWeek === 0 ? 0 : 7 - dayOfWeek;
      const currentQuarter = Math.ceil((now.getMonth() + 1) / 3);
      const quarterEndMonth = currentQuarter * 3;
      const quarterEnd = new Date(now.getFullYear(), quarterEndMonth, 0);
      const daysLeftInQuarter = Math.ceil((quarterEnd - now) / 864e5);

      const urgentTasks = TASKS.filter(t => !isCompleted(t.id, t.frequency)).map(t => {
        const area = AREAS.find(a => a.id === t.areaId);
        let daysLeft, period;
        if (t.frequency === 'weekly') { daysLeft = daysLeftInWeek; period = 'this week'; }
        else if (t.frequency === 'monthly') { daysLeft = daysLeftInMonth; period = 'this month'; }
        else if (t.frequency === 'quarterly') { daysLeft = daysLeftInQuarter; period = 'this quarter'; }
        else return null; // daily tasks reset, not urgent in the same way
        return { task: t.title, area: area?.name, frequency: t.frequency, daysLeft, period, isBoss: !!t.isBoss };
      }).filter(Boolean).filter(t => {
        // Flag as urgent: weekly with <=2 days, monthly with <=10 days, quarterly with <=20 days
        if (t.frequency === 'weekly') return t.daysLeft <= 2;
        if (t.frequency === 'monthly') return t.daysLeft <= 10;
        if (t.frequency === 'quarterly') return t.daysLeft <= 20;
        return false;
      }).sort((a, b) => a.daysLeft - b.daysLeft);

      return {
        currentDateTime: now.toLocaleString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: 'numeric' }),
        dayOfWeek: now.toLocaleDateString('en-US', { weekday: 'long' }),
        dayOfMonth: now.getDate(),
        daysLeftInMonth,
        daysLeftInWeek,
        daysLeftInQuarter,
        overallLevel: getOverallLevel(),
        totalXP: state.totalXP,
        currentMonthAreas: areas,
        dailyActivityLast14Days: last14,
        urgentUncompletedTasks: urgentTasks,
      };
    }

    // ===== COACH: API CALL =====
    let coachLoading = false;

    const COACH_SYSTEM = `You are the user's Sensei — a personal productivity mentor inspired by the Harada Method. The user tracks tasks across 8 life areas (Leadership, Creative Voice, Craft, Finance, Network, Family & Friends, Body, Mind) with daily/weekly/monthly/quarterly habits.

Your style:
- Talk like a supportive friend, casual but insightful
- Keep messages short — 2-3 sentences max per point
- Reference specific task names and numbers when relevant
- Be honest about weak spots but encouraging

URGENCY IS YOUR TOP PRIORITY. The data includes "urgentUncompletedTasks" — these are tasks the user is running out of time to complete in the current week/month/quarter. If there are urgent tasks:
- Call them out by name with how many days are left
- Boss tasks (isBoss: true) are extra important — they are milestone challenges
- Be specific: "You still haven't done 'Storyboard one feature film' and there are only 8 days left this month"
- Pick the 2-3 most urgent or impactful, don't list every single one

When giving your initial check-in (first message), say exactly TWO things:
1. The most urgent thing they need to do (based on deadline pressure + importance)
2. One area that needs more focus overall and why

When answering follow-up questions, be conversational and helpful. You can reference their progress data to give specific advice.

Never use bullet points or lists. Write in natural flowing sentences like a text message from a friend.`;

    async function sendCoachMessage(userMessage) {
      const key = getApiKey();
      if (!key) { showSettings(); return; }
      if (coachLoading) return;

      const history = getCoachHistory();
      const coachData = gatherCoachingData();

      // Add user message to history
      if (userMessage) {
        history.push({ role: 'user', content: userMessage });
      }

      coachLoading = true;
      saveCoachHistory(history);
      updateUI();

      // Build messages array for API
      const apiMessages = [];

      // First message always includes progress data
      if (history.length === 0 || (history.length === 1 && !userMessage)) {
        apiMessages.push({ role: 'user', content: 'Here is my current progress data. Give me my check-in:\n' + JSON.stringify(coachData) });
      } else {
        // Include data context in first message, then conversation
        apiMessages.push({ role: 'user', content: 'Here is my progress data for context:\n' + JSON.stringify(coachData) });
        apiMessages.push({ role: 'assistant', content: history.find(m => m.role === 'assistant')?.content || 'How can I help?' });
        // Add remaining conversation turns (skip first assistant)
        let skippedFirst = false;
        for (const msg of history) {
          if (msg.role === 'assistant' && !skippedFirst) { skippedFirst = true; continue; }
          if (msg.role === 'assistant') apiMessages.push({ role: 'assistant', content: msg.content });
          if (msg.role === 'user' && msg.content !== userMessage) apiMessages.push({ role: 'user', content: msg.content });
        }
        if (userMessage) apiMessages.push({ role: 'user', content: userMessage });
      }

      try {
        const resp = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true', 'content-type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 400,
            temperature: 0.7,
            system: COACH_SYSTEM,
            messages: apiMessages
          })
        });

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          if (resp.status === 401) showToast('Invalid API key. Check Settings.');
          else if (resp.status === 429) showToast('Rate limited. Try again in a minute.');
          else showToast(err.error?.message || 'API error');
          coachLoading = false; updateUI(); return;
        }

        const data = await resp.json();
        const text = data.content?.[0]?.text || '';

        history.push({ role: 'assistant', content: text, timestamp: Date.now() });
        saveCoachHistory(history);
      } catch (e) {
        showToast('Network error. Check your connection.');
      }

      coachLoading = false;
      updateUI();
    }

    function startNewCoachSession() {
      saveCoachHistory([]);
      sendCoachMessage(null);
    }

    function handleCoachInput(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const input = e.target;
        const msg = input.value.trim();
        if (!msg) return;
        input.value = '';
        sendCoachMessage(msg);
      }
    }

    // ===== COACH: PANEL & RENDER =====
    function openCoachPanel() {
      document.getElementById('coachBackdrop').classList.add('open');
      document.getElementById('coachPanel').classList.add('open');
      renderCoachPanel();
      setTimeout(() => document.getElementById('coachInput')?.focus(), 350);
    }
    function closeCoachPanel() {
      document.getElementById('coachBackdrop').classList.remove('open');
      document.getElementById('coachPanel').classList.remove('open');
    }

    function sendFromInput() {
      const input = document.getElementById('coachInput');
      const msg = input.value.trim();
      if (!msg) return;
      input.value = '';
      sendCoachMessage(msg);
    }

    function renderCoachPanel() {
      const body = document.getElementById('coachPanelBody');
      const inputBar = document.getElementById('coachInputBar');
      const key = getApiKey();
      const history = getCoachHistory();

      if (!key) {
        body.innerHTML = `<div class="coach-empty">
      <div class="coach-empty-icon">${icon('coach', 40)}</div>
      <div class="coach-empty-title">Set up your Sensei</div>
      <div class="coach-empty-desc">Add your Anthropic API key in Settings to get AI-powered guidance from your Sensei.</div>
      <button class="coach-btn" onclick="showSettings()">Open Settings</button>
    </div>`;
        inputBar.style.display = 'none';
        return;
      }

      inputBar.style.display = 'flex';

      if (history.length === 0 && !coachLoading) {
        body.innerHTML = `<div class="coach-empty">
      <div class="coach-empty-icon">${icon('coach', 40)}</div>
      <div class="coach-empty-title">Ready when you are</div>
      <div class="coach-empty-desc">Start a conversation with your sensei for personalized guidance based on your progress.</div>
      <button class="coach-btn" onclick="startNewCoachSession()">Start Check-in</button>
    </div>`;
        return;
      }

      let html = '<div class="coach-chat">';
      for (const msg of history) {
        if (msg.role === 'assistant') {
          html += `<div class="coach-bubble coach-msg">${msg.content}</div>`;
        } else if (msg.role === 'user') {
          html += `<div class="coach-bubble user-msg">${msg.content}</div>`;
        }
      }
      if (coachLoading) {
        html += `<div class="coach-loading"><div class="coach-loading-dots"><div class="coach-loading-dot"></div><div class="coach-loading-dot"></div><div class="coach-loading-dot"></div></div></div>`;
      }
      html += '</div>';
      body.innerHTML = html;

      // Scroll to bottom
      body.scrollTop = body.scrollHeight;
    }

    function renderCoach() { renderCoachPanel(); }

    // ===== INIT =====
    updateUI(); renderDashboard();
  </script>
</body>
