<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F0EDE4">
<title>Harada Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Caveat:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #F0EDE4;
  --bg-card: #FAFAF5;
  --text: #1A1A2E;
  --text-secondary: #555566;
  --text-muted: #8E8E9A;
  --border: #D8D4CA;
  --ink: #1B35DB;
  --ink-light: #4A62E8;
  --ink-faint: rgba(27,53,219,0.08);
  --ink-shadow: rgba(27,53,219,0.25);
  --xp-gold: #C4960D;
  --streak-fire: #E06720;
  --success: #2D8A4E;
  --danger: #C03030;
  --font-display: 'Space Grotesk', system-ui, sans-serif;
  --font-hand: 'Caveat', cursive;
  --font-body: 'DM Sans', system-ui, sans-serif;
  --radius: 14px;
  --radius-sm: 10px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  overflow-x: hidden;
}

/* Paper texture */
body::after {
  content: '';
  position: fixed; inset: 0;
  pointer-events: none; z-index: 9999; opacity: 0.06;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 180px;
}

h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }

.app { max-width: 480px; margin: 0 auto; padding-bottom: 90px; min-height: 100dvh; }

/* ===== INLINE SVG ICONS ===== */
.icon-svg { display: inline-block; vertical-align: middle; }
.icon-svg svg {
  width: 100%; height: 100%;
  stroke: var(--ink); fill: none; stroke-width: 2.2;
  stroke-linecap: round; stroke-linejoin: round;
}
.icon-svg.filled svg { fill: var(--ink); stroke: none; }

/* ===== HEADER ===== */
.header {
  padding: 20px 20px 0;
  display: flex; align-items: center; justify-content: space-between;
}
.header-title {
  font-family: var(--font-hand); font-size: 1.6rem; font-weight: 700;
  color: var(--ink); letter-spacing: 0;
}
.header-level {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--font-display); font-weight: 700; font-size: 0.8rem; color: var(--xp-gold);
  background: var(--bg-card); padding: 5px 14px; border-radius: 20px;
  border: 2px solid var(--xp-gold);
}

/* ===== GLOBAL XP BAR ===== */
.xp-bar-container { margin: 14px 20px 0; background: var(--border); border-radius: 6px; height: 8px; overflow: hidden; }
.xp-bar-fill {
  height: 100%; background: linear-gradient(90deg, #D4A017, #B8860B);
  border-radius: 6px; transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}
.xp-label { display: flex; justify-content: space-between; margin: 5px 20px 0; font-size: 0.7rem; color: var(--text-muted); font-weight: 500; }

/* ===== VIEWS ===== */
.view { display: none; padding: 20px; }
.view.active { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.section-title {
  font-family: var(--font-hand); font-size: 1.2rem;
  color: var(--ink); margin-bottom: 14px; font-weight: 600;
}

/* ===== SWIPEABLE CARD CAROUSEL ===== */
.carousel-wrapper { position: relative; margin-bottom: 24px; }
.carousel {
  display: flex; gap: 14px;
  overflow-x: auto; scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  padding: 4px 0 16px;
  scrollbar-width: none;
}
.carousel::-webkit-scrollbar { display: none; }

.area-card {
  flex: 0 0 calc(100% - 40px);
  scroll-snap-align: center;
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 22px;
  border: 2px solid var(--border);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  position: relative; overflow: hidden;
  min-height: 155px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.area-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: var(--ink);
}
.area-card:active { transform: scale(0.97); }

.area-card-top { display: flex; align-items: flex-start; justify-content: space-between; }
.area-card-icon { width: 36px; height: 36px; }
.area-card-level-badge {
  font-family: var(--font-display); font-size: 0.72rem; font-weight: 700;
  color: white; background: var(--ink);
  padding: 3px 10px; border-radius: 10px;
}
.area-card-name {
  font-family: var(--font-display); font-size: 1.2rem; font-weight: 700;
  margin: 10px 0 3px; color: var(--text);
}
.area-card-progress-text { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; margin-bottom: 10px; }
.area-card-bar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
.area-card-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; background: var(--ink); }
.area-card-tasks-done {
  display: flex; align-items: center; gap: 6px;
  margin-top: 10px; font-size: 0.75rem; color: var(--text-secondary); font-weight: 500;
}

.carousel-dots { display: flex; justify-content: center; gap: 6px; }
.carousel-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); transition: all 0.3s; }
.carousel-dot.active { background: var(--ink); width: 18px; border-radius: 3px; }

/* ===== MONTHLY PROGRESS BUTTON ===== */
.monthly-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 14px;
  background: var(--bg-card); border: 2px solid var(--border); border-radius: var(--radius);
  font-family: var(--font-hand); font-size: 1.1rem; font-weight: 600;
  color: var(--ink); cursor: pointer;
  transition: transform 0.15s;
  margin-bottom: 24px;
}
.monthly-btn:active { transform: scale(0.97); }
.monthly-btn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2.2; stroke-linecap: round; }

/* ===== AREA DETAIL VIEW ===== */
.area-detail-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.back-btn {
  width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--border);
  background: var(--bg-card); display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.back-btn svg { width: 16px; height: 16px; stroke: var(--ink); fill: none; stroke-width: 2.5; stroke-linecap: round; }
.back-btn:active { transform: scale(0.93); }

.area-detail-title { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.area-detail-title .icon-svg { width: 28px; height: 28px; }
.area-detail-level { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); }

.area-detail-xp-bar { height: 6px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 5px; }
.area-detail-xp-bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; background: var(--ink); }
.area-detail-xp-label { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 18px; }

/* ===== MONTHLY OVERVIEW ===== */
.monthly-header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.monthly-subtitle { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 22px; font-family: var(--font-hand); font-size: 1rem; }

.monthly-area-row {
  background: var(--bg-card); border-radius: var(--radius-sm);
  padding: 14px; margin-bottom: 8px; border: 2px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
.monthly-area-icon { width: 24px; height: 24px; flex-shrink: 0; }
.monthly-area-info { flex: 1; min-width: 0; }
.monthly-area-name { font-family: var(--font-display); font-size: 0.82rem; font-weight: 700; margin-bottom: 5px; }
.monthly-area-bar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
.monthly-area-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; background: var(--ink); }
.monthly-area-pct {
  font-family: var(--font-display); font-size: 0.82rem; font-weight: 700;
  flex-shrink: 0; min-width: 36px; text-align: right; color: var(--ink);
}

.monthly-radar-container {
  background: var(--bg-card); border-radius: var(--radius);
  padding: 22px 14px; margin-bottom: 18px; border: 2px solid var(--border);
}

/* ===== TASK CARD ===== */
.task-card {
  background: var(--bg-card); border-radius: var(--radius-sm);
  padding: 13px 15px; margin-bottom: 7px;
  display: flex; align-items: center; gap: 12px;
  border: 2px solid var(--border); cursor: pointer;
  transition: transform 0.15s, background 0.2s;
  position: relative; overflow: hidden;
  user-select: none; -webkit-user-select: none;
}
.task-card:active { transform: scale(0.98); }
.task-card.completed {
  background: linear-gradient(135deg, #E8A849 0%, #D4923A 30%, #C98632 50%, #DDA24A 70%, #E5B05E 100%);
  border-color: #C08030;
  position: relative;
  animation: paintIn 0.5s ease both;
}
.task-card.completed::after {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  pointer-events: none;
  opacity: 0.12;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 120px;
}
.task-card.completed .task-title {
  color: #3A2510;
  text-decoration: line-through;
  text-decoration-color: rgba(58, 37, 16, 0.3);
  text-decoration-thickness: 1.5px;
}
.task-card.completed .task-freq { background: rgba(58,37,16,0.12); color: #3A2510; }
.task-card.completed .task-xp { color: #3A2510; }
.task-card.completed .task-streak { color: #3A2510; }
@keyframes paintIn {
  0% { background-size: 0% 100%; opacity: 0.7; }
  100% { background-size: 100% 100%; opacity: 1; }
}

.task-checkbox {
  width: 24px; height: 24px; border-radius: 6px;
  border: 2.5px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  background: var(--bg);
}
.task-card.completed .task-checkbox {
  background: #3A2510; border-color: #3A2510;
  animation: checkBounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.task-checkbox svg {
  width: 13px; height: 13px; stroke: white; stroke-width: 3; fill: none;
  opacity: 0; transform: scale(0); stroke-linecap: round; stroke-linejoin: round;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.task-card.completed .task-checkbox svg { opacity: 1; transform: scale(1); }

.task-info { flex: 1; min-width: 0; }
.task-title { font-size: 0.85rem; font-weight: 500; line-height: 1.3; }
.task-meta { display: flex; align-items: center; gap: 7px; margin-top: 3px; }
.task-freq {
  font-size: 0.65rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.04em; padding: 2px 6px; border-radius: 4px;
  background: var(--ink-faint); color: var(--ink);
}
.task-streak { font-size: 0.7rem; font-weight: 700; color: var(--streak-fire); }
.task-xp { font-size: 0.7rem; font-weight: 700; color: var(--xp-gold); margin-left: auto; flex-shrink: 0; }

/* ===== BOSS CARD ===== */
.boss-card {
  background: var(--bg-card); border-radius: var(--radius);
  padding: 16px; margin-bottom: 10px;
  border: 2px solid var(--ink); position: relative; overflow: hidden; cursor: pointer;
}
.boss-label {
  font-family: var(--font-hand); font-size: 0.9rem;
  color: var(--ink); font-weight: 600; margin-bottom: 4px;
}
.boss-title { font-family: var(--font-display); font-size: 0.95rem; font-weight: 700; margin-bottom: 10px; }
.boss-power-bar { height: 6px; background: var(--ink-faint); border-radius: 3px; overflow: hidden; margin-bottom: 5px; }
.boss-power-fill { height: 100%; background: var(--ink); border-radius: 3px; transition: width 0.6s ease; }
.boss-power-label { font-size: 0.68rem; color: var(--text-secondary); font-weight: 500; }

/* ===== XP FLOAT ===== */
.xp-float {
  position: fixed; font-family: var(--font-hand); font-weight: 700;
  font-size: 1.4rem; color: var(--xp-gold); pointer-events: none; z-index: 1000;
  animation: floatUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
}
@keyframes checkBounce { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

/* ===== LEVEL UP OVERLAY ===== */
.level-up-overlay {
  position: fixed; inset: 0; z-index: 2000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(240, 237, 228, 0.96); backdrop-filter: blur(8px);
  animation: overlayIn 0.5s ease; cursor: pointer;
}
@keyframes overlayIn { 0% { opacity: 0; } 100% { opacity: 1; } }
.level-up-badge {
  width: 110px; height: 110px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 24px; background: var(--ink-faint); border: 3px solid var(--ink);
  animation: badgePop 0.6s 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
.level-up-badge .icon-svg { width: 50px; height: 50px; }
@keyframes badgePop { 0% { transform: scale(0) rotate(-20deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
.level-up-text {
  font-family: var(--font-hand); font-size: 1.2rem;
  color: var(--ink); font-weight: 700; margin-bottom: 6px;
  animation: textIn 0.4s 0.4s ease both;
}
.level-up-level { font-family: var(--font-display); font-size: 2.8rem; font-weight: 700; animation: textIn 0.4s 0.5s ease both; }
.level-up-area { font-size: 1rem; color: var(--text-secondary); margin-top: 4px; animation: textIn 0.4s 0.6s ease both; }
.level-up-dismiss { font-size: 0.72rem; color: var(--text-muted); margin-top: 30px; animation: textIn 0.4s 0.8s ease both; }
@keyframes textIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }

/* ===== TOAST ===== */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
  background: var(--bg-card); border: 2px solid var(--ink); border-radius: var(--radius);
  padding: 10px 18px; font-family: var(--font-hand); font-weight: 600; font-size: 1rem;
  color: var(--ink);
  z-index: 1500; box-shadow: 0 6px 24px rgba(0,0,0,0.1); white-space: nowrap;
  animation: toastIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, toastOut 0.3s 2.5s ease forwards;
}
@keyframes toastIn { 0% { transform: translateX(-50%) translateY(-100px); } 100% { transform: translateX(-50%) translateY(0); } }
@keyframes toastOut { 0% { transform: translateX(-50%) translateY(0); opacity: 1; } 100% { transform: translateX(-50%) translateY(-100px); opacity: 0; } }

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg-card); border-top: 2px solid var(--border);
  display: flex; justify-content: center; padding: 6px 0;
  padding-bottom: max(6px, env(safe-area-inset-bottom)); z-index: 100;
}
.nav-item {
  flex: 1; max-width: 110px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 7px 0; cursor: pointer; color: var(--text-muted);
  transition: color 0.2s; background: none; border: none; font-family: var(--font-body);
}
.nav-item.active { color: var(--ink); }
.nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.nav-item.active svg { stroke-width: 2.8; }
.nav-label { font-size: 0.62rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }

/* ===== STATS ===== */
.stat-row {
  display: flex; justify-content: space-between;
  background: var(--bg-card); border-radius: var(--radius-sm);
  padding: 14px; margin-bottom: 7px; border: 2px solid var(--border);
}
.stat-label { font-size: 0.78rem; color: var(--text-secondary); }
.stat-value { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }

.heatmap { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 10px; }
.heatmap-cell { aspect-ratio: 1; border-radius: 3px; background: var(--border); }
.heatmap-cell.l1 { background: #C5DAF0; } .heatmap-cell.l2 { background: #7BA4E0; }
.heatmap-cell.l3 { background: #4A6FD0; } .heatmap-cell.l4 { background: var(--ink); }

.streak-card {
  background: var(--bg-card); border-radius: var(--radius-sm);
  padding: 12px 14px; margin-bottom: 7px; border: 2px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.streak-fire-icon { font-size: 1.2rem; animation: firePulse 1.5s ease-in-out infinite; }
@keyframes firePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
.streak-info { flex: 1; }
.streak-task-name { font-size: 0.78rem; font-weight: 500; }
.streak-count { font-family: var(--font-display); font-weight: 700; font-size: 1rem; color: var(--streak-fire); }
.streak-mult {
  font-size: 0.68rem; font-weight: 700;
  background: var(--ink-faint); color: var(--ink); padding: 2px 7px; border-radius: 5px;
}

/* ===== DESKTOP LAYOUT ===== */
.app-desktop { display: none; }
@media (min-width: 768px) {
  .app { display: none; }
  .bottom-nav { display: none; }
  .app-desktop { display: block; max-width: 1200px; margin: 0 auto; padding: 24px 32px 40px; }
  .desktop-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .desktop-header .header-title { font-size: 1.8rem; }
  .desktop-xp-section { margin-bottom: 28px; }
  .desktop-xp-section .xp-bar-container { margin: 12px 0 0; }
  .desktop-xp-section .xp-label { margin: 6px 0 0; }
  .desktop-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; align-items: start; }
  .desktop-col { min-width: 0; }
  .desktop-col-title { font-family: var(--font-hand); font-size: 1.3rem; font-weight: 600; margin-bottom: 14px; color: var(--ink); }
  .desktop-area-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 18px; }
  .desktop-area-card {
    background: var(--bg-card); border-radius: var(--radius-sm);
    padding: 13px; border: 2px solid var(--border);
    cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
    position: relative; overflow: hidden;
  }
  .desktop-area-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background: var(--ink); }
  .desktop-area-card:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(27,53,219,0.1); }
  .desktop-area-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
  .desktop-area-card-icon { width: 22px; height: 22px; }
  .desktop-area-card-lv { font-family: var(--font-display); font-size: 0.62rem; font-weight: 700; color: white; background: var(--ink); padding: 2px 7px; border-radius: 7px; }
  .desktop-area-card-name { font-family: var(--font-display); font-size: 0.78rem; font-weight: 700; margin-bottom: 5px; }
  .desktop-area-card-bar { height: 4px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .desktop-area-card-bar-fill { height: 100%; border-radius: 3px; background: var(--ink); }
  .desktop-area-card-meta { font-size: 0.65rem; color: var(--text-muted); margin-top: 5px; }
  .desktop-radar { background: var(--bg-card); border-radius: var(--radius); padding: 18px 14px; margin-bottom: 18px; border: 2px solid var(--border); }
  .desktop-tasks-scroll { max-height: calc(100vh - 180px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; padding-right: 4px; }
  .desktop-tasks-scroll::-webkit-scrollbar { width: 4px; }
  .desktop-tasks-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .desktop-stats-card { background: var(--bg-card); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; border: 2px solid var(--border); }
  .desktop-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 14px; }

// ===== STATE =====
const STATE_KEY = 'harada-quest-state';
function getDefaultState() { return { totalXP:0, areaXP:Object.fromEntries(AREAS.map(a=>[a.id,0])), completions:{}, streaks:{}, bossesDefeated:[] }; }
let state = loadState();
function loadState() { try { const s=localStorage.getItem(STATE_KEY); if(s) return {...getDefaultState(),...JSON.parse(s)}; } catch(e){} return getDefaultState(); }
function saveState() { localStorage.setItem(STATE_KEY, JSON.stringify(state)); }

// ===== DATE UTILS =====
function getPeriodKey(freq,d=new Date()) {
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  if(freq==='daily') return `${y}-${m}-${day}`;
  if(freq==='weekly') { const j=new Date(y,0,1); const days=Math.floor((d-j)/864e5); return `${y}-W${String(Math.ceil((days+j.getDay()+1)/7)).padStart(2,'0')}`; }
  if(freq==='monthly') return `${y}-${m}`;
  if(freq==='quarterly') return `${y}-Q${Math.ceil((d.getMonth()+1)/3)}`;
  return `${y}-${m}-${day}`;
}
function getPrevPeriod(freq,key) {
  if(freq==='daily') { const d=new Date(key);d.setDate(d.getDate()-1); return getPeriodKey('daily',d); }
  if(freq==='weekly') { const [y,w]=key.split('-W').map(Number); return w<=1?`${y-1}-W52`:`${y}-W${String(w-1).padStart(2,'0')}`; }
  if(freq==='monthly') { const [y,m]=key.split('-').map(Number); return m<=1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,'0')}`; }
  if(freq==='quarterly') { const [y,q]=key.replace('Q','').split('-').map(Number); return q<=1?`${y-1}-Q4`:`${y}-Q${q-1}`; }
}
function isCompleted(taskId,freq) { return !!state.completions[`${taskId}:${getPeriodKey(freq)}`]; }

// ===== XP =====
function xpForLevel(l) { return l<=1?0:Math.floor(50*Math.pow(l,1.5)); }
function getLevel(xp) { let l=1; while(xpForLevel(l+1)<=xp) l++; return l; }
function getLevelProgress(xp) { const l=getLevel(xp); return (xp-xpForLevel(l))/(xpForLevel(l+1)-xpForLevel(l)); }
function getOverallLevel() { return Math.floor(AREAS.map(a=>getLevel(state.areaXP[a.id]||0)).reduce((s,l)=>s+l,0)/AREAS.length); }
function getMultiplier(s) { return s>=30?2:s>=14?1.75:s>=7?1.5:s>=3?1.25:1; }

// ===== COMPLETE TASK =====
function completeTask(taskId,cardEl) {
  const task=TASKS.find(t=>t.id===taskId); if(!task) return;
  const period=getPeriodKey(task.frequency); const ck=`${taskId}:${period}`;
  if(state.completions[ck]) {
    delete state.completions[ck];
    const sk=state.streaks[taskId]||{current:0}; const m=getMultiplier(sk.current); const xp=Math.round(task.baseXP*m);
    state.totalXP=Math.max(0,state.totalXP-xp); state.areaXP[task.areaId]=Math.max(0,(state.areaXP[task.areaId]||0)-xp);
    saveState(); updateUI(); return;
  }
  if(!state.streaks[taskId]) state.streaks[taskId]={current:0,longest:0,lastPeriod:null};
  const sk=state.streaks[taskId]; const prev=getPrevPeriod(task.frequency,period);
  if(sk.lastPeriod===prev) sk.current++; else if(sk.lastPeriod!==period) sk.current=1;
  sk.lastPeriod=period; sk.longest=Math.max(sk.longest,sk.current);
  const mult=getMultiplier(sk.current); const earned=Math.round(task.baseXP*mult);
  const oldLevel=getLevel(state.areaXP[task.areaId]||0);
  state.completions[ck]=Date.now(); state.totalXP+=earned; state.areaXP[task.areaId]=(state.areaXP[task.areaId]||0)+earned;
  saveState();
  showXPFloat(cardEl,earned,mult);
  if([3,7,14,30].includes(sk.current)) showToast(`${sk.current}-streak! ${mult}x multiplier`);
  const newLevel=getLevel(state.areaXP[task.areaId]);
  if(newLevel>oldLevel) { const area=AREAS.find(a=>a.id===task.areaId); setTimeout(()=>showLevelUp(area,newLevel),600); }
  if(navigator.vibrate) navigator.vibrate(30);
  updateUI();
}

// ===== ANIMATIONS =====
function showXPFloat(el,xp,mult) {
  const r=el.getBoundingClientRect(); const f=document.createElement('div');
  f.className='xp-float'; f.textContent=mult>1?`+${xp} XP (${mult}x)`:`+${xp} XP`;
  f.style.left=`${r.right-60}px`; f.style.top=`${r.top}px`;
  document.body.appendChild(f); setTimeout(()=>f.remove(),1300);
}
function showToast(msg) {
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),3000);
}
function showLevelUp(area,level) {
  const o=document.createElement('div'); o.className='level-up-overlay';
  o.innerHTML=`<div class="level-up-badge">${icon(area.iconKey,50)}</div>
    <div class="level-up-text">Level Up!</div><div class="level-up-level">Level ${level}</div>
    <div class="level-up-area">${area.name}</div><div class="level-up-dismiss">tap to continue</div>`;
  o.addEventListener('click',()=>o.remove()); document.body.appendChild(o);
  if(navigator.vibrate) navigator.vibrate([50,30,100]);
}

// ===== HELPERS =====
function getAreaCompletion(areaId) {
  const tasks=TASKS.filter(t=>t.areaId===areaId);
  const done=tasks.filter(t=>isCompleted(t.id,t.frequency)).length;
  return { done, total:tasks.length, pct:tasks.length?Math.round(done/tasks.length*100):0 };
}

// ===== RENDER =====
function isDesktop() { return window.innerWidth >= 768; }
function updateUI() {
  updateGlobalBar();
  if(isDesktop()) renderDesktop();
  else {
    const active=document.querySelector('.view.active');
    if(active) {
      if(active.id==='view-dashboard') renderDashboard();
      else if(active.id==='view-checkin') renderCheckin();
      else if(active.id==='view-stats') renderStats();
      else if(active.id==='view-area-detail') renderAreaDetail(active.dataset.areaId);
      else if(active.id==='view-monthly') renderMonthly();
    }
  }
}
function updateGlobalBar() {
  const l=getOverallLevel(); const p=getLevelProgress(state.totalXP);
  document.getElementById('globalLevel').textContent=`LV ${l}`;
  document.getElementById('globalXpBar').style.width=`${Math.min(100,p*100)}%`;
  document.getElementById('xpCurrent').textContent=`${state.totalXP} XP`;
  document.getElementById('xpNext').textContent=`${xpForLevel(l+1)-state.totalXP} XP to Lv ${l+1}`;
  const ld=document.getElementById('globalLevelD');
  if(ld) { ld.textContent=`LV ${l}`; document.getElementById('globalXpBarD').style.width=`${Math.min(100,p*100)}%`;
    document.getElementById('xpCurrentD').textContent=`${state.totalXP} XP`;
    document.getElementById('xpNextD').textContent=`${xpForLevel(l+1)-state.totalXP} XP to Lv ${l+1}`; }
}

// Helper: render task card HTML
function taskCardHTML(task, areaColor) {
  const completed=isCompleted(task.id,task.frequency);
  const sk=state.streaks[task.id]; const sc=sk?sk.current:0; const m=getMultiplier(sc); const xp=Math.round(task.baseXP*m);
  return `<div class="task-card ${completed?'completed':''}" onclick="completeTask('${task.id}',this)"
    ${task.isBoss?`style="border-left:3px solid var(--ink)"`:''}>
    <div class="task-checkbox"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
    <div class="task-info">
      <div class="task-title">${task.isBoss?'~ ':''}${task.title}</div>
      <div class="task-meta"><span class="task-freq">${task.frequency}</span>${sc>1?`<span class="task-streak">${icon('fire',14)} ${sc}</span>`:''}</div>
    </div>
    <div class="task-xp">${completed?'✓':`+${xp}`}</div>
  </div>`;
}

// Helper: area tasks grouped HTML
function areaTasksGroupHTML(areas_list, questListId) {
  return areas_list.map(area => {
    const tasks=TASKS.filter(t=>t.areaId===area.id).filter(t=>{
      if(t.frequency==='daily'||t.frequency==='weekly') return true;
      return !isCompleted(t.id,t.frequency);
    });
    if(!tasks.length) return '';
    const done=tasks.filter(t=>isCompleted(t.id,t.frequency)).length;
    return `<div style="margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        ${icon(area.iconKey,16)}
        <div style="font-family:var(--font-display);font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-secondary)">${area.name}</div>
        <div style="font-size:0.68rem;color:var(--text-muted);margin-left:auto">${done}/${tasks.length}</div>
      </div>
      ${tasks.map(t=>taskCardHTML(t,area.color)).join('')}
    </div>`;
  }).join('');
}

// Helper: boss list HTML
function bossListHTML(containerId) {
  const bossTasks=TASKS.filter(t=>t.isBoss&&!isCompleted(t.id,t.frequency)).slice(0,3);
  if(!bossTasks.length) return '<p style="color:var(--text-muted);font-size:0.82rem;">All bosses defeated!</p>';
  return bossTasks.map(boss=>{
    const area=AREAS.find(a=>a.id===boss.areaId);
    const nonBoss=TASKS.filter(t=>t.areaId===boss.areaId&&!t.isBoss);
    const done=nonBoss.filter(t=>isCompleted(t.id,t.frequency)).length;
    const req=Math.ceil(nonBoss.length*0.75); const powered=done>=req;
    return `<div class="boss-card" onclick="${powered?`completeTask('${boss.id}',this)`:''}">
      <div class="boss-label">~ Boss — ${area.name}</div>
      <div class="boss-title">${boss.title}</div>
      <div class="boss-power-bar"><div class="boss-power-fill" style="width:${Math.min(100,done/req*100)}%"></div></div>
      <div class="boss-power-label">${powered?'Powered up! Tap to fight!':`Power up: ${done}/${req} tasks`}</div>
    </div>`;
  }).join('');
}

// ----- Mobile: Dashboard -----
let currentCarouselIndex=0;
function renderDashboard() {
  const carousel=document.getElementById('areaCarousel');
  const dots=document.getElementById('carouselDots');
  carousel.innerHTML=AREAS.map((area,i)=>{
    const xp=state.areaXP[area.id]||0; const level=getLevel(xp); const progress=getLevelProgress(xp); const comp=getAreaCompletion(area.id);
    return `<div class="area-card" onclick="showAreaDetail('${area.id}')" data-index="${i}">
      <div><div class="area-card-top"><div class="area-card-icon">${icon(area.iconKey,36)}</div>
        <div class="area-card-level-badge">LV ${level}</div></div>
      <div class="area-card-name">${area.name}</div>
      <div class="area-card-progress-text">${xp} XP · ${xpForLevel(level+1)-xp} to next level</div></div>
      <div><div class="area-card-bar"><div class="area-card-bar-fill" style="width:${progress*100}%"></div></div>
      <div class="area-card-tasks-done"><span style="color:var(--ink);font-weight:700">${comp.done}/${comp.total}</span> tasks this period</div></div>
    </div>`;
  }).join('');
  dots.innerHTML=AREAS.map((_,i)=>`<div class="carousel-dot ${i===currentCarouselIndex?'active':''}" data-i="${i}"></div>`).join('');
  carousel.onscroll=()=>{ const cw=carousel.firstElementChild?.offsetWidth||1; const idx=Math.round(carousel.scrollLeft/(cw+14));
    if(idx!==currentCarouselIndex) { currentCarouselIndex=idx; dots.querySelectorAll('.carousel-dot').forEach((d,i)=>d.classList.toggle('active',i===idx)); }};
  document.getElementById('bossList').innerHTML=bossListHTML('bossList');
}

// ----- Mobile: Area Detail -----
function showAreaDetail(areaId) { hideAllViews(); const v=document.getElementById('view-area-detail'); v.dataset.areaId=areaId; v.classList.add('active'); renderAreaDetail(areaId); }
function renderAreaDetail(areaId) {
  const area=AREAS.find(a=>a.id===areaId); if(!area) return;
  const v=document.getElementById('view-area-detail');
  const xp=state.areaXP[areaId]||0; const level=getLevel(xp); const progress=getLevelProgress(xp);
  const tasks=TASKS.filter(t=>t.areaId===areaId);
  v.innerHTML=`<div class="area-detail-header"><div class="back-btn" onclick="switchView('dashboard')">
    <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></div>
    <div><div class="area-detail-title">${icon(area.iconKey,28)} ${area.name}</div>
    <div class="area-detail-level">Level ${level} · ${xp} XP</div></div></div>
    <div class="area-detail-xp-bar"><div class="area-detail-xp-bar-fill" style="width:${progress*100}%"></div></div>
    <div class="area-detail-xp-label">${xpForLevel(level+1)-xp} XP to Level ${level+1}</div>
    ${tasks.map(t=>taskCardHTML(t,area.color)).join('')}`;
}

// ----- Mobile: Monthly -----
function showMonthly() { hideAllViews(); document.getElementById('view-monthly').classList.add('active'); renderMonthly(); }
let monthlyChart=null;
function renderMonthly() {
  const v=document.getElementById('view-monthly');
  const monthName=new Date().toLocaleDateString('en-US',{month:'long',year:'numeric'});
  v.innerHTML=`<div class="monthly-header"><div class="back-btn" onclick="switchView('dashboard')">
    <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></div>
    <div><h2 style="font-family:var(--font-hand);font-size:1.5rem;color:var(--ink)">Monthly Progress</h2></div></div>
    <div class="monthly-subtitle">${monthName}</div>
    <div class="monthly-radar-container"><canvas id="monthlyRadar" height="280"></canvas></div>
    ${AREAS.map(area=>{const comp=getAreaCompletion(area.id);
      return `<div class="monthly-area-row">${icon(area.iconKey,24)}<div class="monthly-area-info">
        <div class="monthly-area-name">${area.name}</div>
        <div class="monthly-area-bar"><div class="monthly-area-bar-fill" style="width:${comp.pct}%"></div></div>
      </div><div class="monthly-area-pct">${comp.pct}%</div></div>`;}).join('')}`;
  setTimeout(()=>{ const ctx=document.getElementById('monthlyRadar'); if(!ctx) return;
    const data=AREAS.map(a=>getLevel(state.areaXP[a.id]||0)); const maxL=Math.max(5,...data);
    if(monthlyChart){monthlyChart.destroy();monthlyChart=null;}
    monthlyChart=new Chart(ctx.getContext('2d'),{type:'radar',data:{labels:AREAS.map(a=>a.name),datasets:[{data,backgroundColor:'rgba(27,53,219,0.06)',borderColor:'var(--ink)',borderWidth:2.5,pointBackgroundColor:'var(--ink)',pointBorderColor:'#fff',pointBorderWidth:2,pointRadius:5}]},
    options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false}},scales:{r:{min:0,max:maxL,ticks:{display:false,stepSize:1},grid:{color:'rgba(0,0,0,0.06)'},angleLines:{color:'rgba(0,0,0,0.06)'},pointLabels:{font:{family:'Space Grotesk',size:10,weight:600},color:'#555566'}}},animation:{duration:600,easing:'easeOutQuart'}}});
  },50);
}

// ----- Mobile: Check-in -----
function renderCheckin() {
  document.getElementById('checkinDate').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  document.getElementById('questList').innerHTML=areaTasksGroupHTML(AREAS);
}

// ----- Mobile: Stats -----
function renderStats() {
  const c=document.getElementById('statsContent');
  const total=Object.keys(state.completions).length;
  const todayKey=getPeriodKey('daily');
  const today=Object.keys(state.completions).filter(k=>k.endsWith(`:${todayKey}`)).length;
  const topStreaks=Object.entries(state.streaks).filter(([_,s])=>s.current>0).sort((a,b)=>b[1].current-a[1].current).slice(0,5);
  const cells=[]; for(let i=27;i>=0;i--) { const d=new Date();d.setDate(d.getDate()-i); const k=getPeriodKey('daily',d);
    const cnt=Object.keys(state.completions).filter(c=>c.endsWith(`:${k}`)).length;
    let l=''; if(cnt>=8)l='l4';else if(cnt>=5)l='l3';else if(cnt>=2)l='l2';else if(cnt>=1)l='l1';
    cells.push(`<div class="heatmap-cell ${l}"></div>`); }
  c.innerHTML=`
    <div class="stat-row"><span class="stat-label">Total XP</span><span class="stat-value" style="color:var(--xp-gold)">${state.totalXP}</span></div>
    <div class="stat-row"><span class="stat-label">Overall Level</span><span class="stat-value">${getOverallLevel()}</span></div>
    <div class="stat-row"><span class="stat-label">Tasks Completed</span><span class="stat-value">${total}</span></div>
    <div class="stat-row"><span class="stat-label">Today</span><span class="stat-value">${today}</span></div>
    <div class="section-title" style="margin-top:22px">Last 28 Days</div>
    <div style="background:var(--bg-card);border-radius:var(--radius-sm);padding:14px;border:2px solid var(--border)"><div class="heatmap">${cells.join('')}</div></div>
    ${topStreaks.length?`<div class="section-title" style="margin-top:22px">Active Streaks</div>
      ${topStreaks.map(([id,s])=>{const t=TASKS.find(x=>x.id===id);const m=getMultiplier(s.current);
        return `<div class="streak-card"><div class="streak-fire-icon">${icon('fire',20)}</div><div class="streak-info"><div class="streak-task-name">${t?t.title:id}</div></div>
        <div class="streak-count">${s.current}</div>${m>1?`<div class="streak-mult">${m}x</div>`:''}</div>`;}).join('')}`:''}`;
}

// ===== DESKTOP RENDERING =====
let desktopRadarChart=null;
function renderDesktop() {
  // Areas
  document.getElementById('desktopAreaGrid').innerHTML=AREAS.map(area=>{
    const xp=state.areaXP[area.id]||0;const level=getLevel(xp);const progress=getLevelProgress(xp);const comp=getAreaCompletion(area.id);
    return `<div class="desktop-area-card" onclick="showDesktopAreaDetail('${area.id}')">
      <div class="desktop-area-card-top">${icon(area.iconKey,22)}<div class="desktop-area-card-lv">LV ${level}</div></div>
      <div class="desktop-area-card-name">${area.name}</div>
      <div class="desktop-area-card-bar"><div class="desktop-area-card-bar-fill" style="width:${progress*100}%"></div></div>
      <div class="desktop-area-card-meta"><span style="color:var(--ink);font-weight:700">${comp.done}/${comp.total}</span> done</div>
    </div>`;}).join('');
  // Radar
  const ctx=document.getElementById('desktopRadar'); if(ctx) {
    const data=AREAS.map(a=>getLevel(state.areaXP[a.id]||0)); const maxL=Math.max(5,...data);
    if(desktopRadarChart) { desktopRadarChart.data.datasets[0].data=data; desktopRadarChart.options.scales.r.max=maxL; desktopRadarChart.update('none'); }
    else { desktopRadarChart=new Chart(ctx.getContext('2d'),{type:'radar',data:{labels:AREAS.map(a=>a.name),datasets:[{data,backgroundColor:'rgba(27,53,219,0.06)',borderColor:'#1B35DB',borderWidth:2.5,pointBackgroundColor:'#1B35DB',pointBorderColor:'#fff',pointBorderWidth:2,pointRadius:5}]},
      options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false}},scales:{r:{min:0,max:maxL,ticks:{display:false,stepSize:1},grid:{color:'rgba(0,0,0,0.06)'},angleLines:{color:'rgba(0,0,0,0.06)'},pointLabels:{font:{family:'Space Grotesk',size:10,weight:600},color:'#555566'}}},animation:{duration:600,easing:'easeOutQuart'}}}); }
  }
  // Check-in
  document.getElementById('desktopCheckinDate').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  document.getElementById('desktopQuestList').innerHTML=areaTasksGroupHTML(AREAS);
  // Bosses
  document.getElementById('desktopBossList').innerHTML=bossListHTML();
  // Stats
  const total=Object.keys(state.completions).length; const todayKey=getPeriodKey('daily');
  const today=Object.keys(state.completions).filter(k=>k.endsWith(`:${todayKey}`)).length;
  document.getElementById('desktopStatsGrid').innerHTML=`
    <div class="desktop-stat-item"><span class="desktop-stat-value" style="color:var(--xp-gold)">${state.totalXP}</span><div class="desktop-stat-label">Total XP</div></div>
    <div class="desktop-stat-item"><span class="desktop-stat-value">${getOverallLevel()}</span><div class="desktop-stat-label">Level</div></div>
    <div class="desktop-stat-item"><span class="desktop-stat-value">${total}</span><div class="desktop-stat-label">Completed</div></div>
    <div class="desktop-stat-item"><span class="desktop-stat-value">${today}</span><div class="desktop-stat-label">Today</div></div>`;
  const hm=document.getElementById('desktopHeatmap'); hm.innerHTML='';
  for(let i=27;i>=0;i--) { const d=new Date();d.setDate(d.getDate()-i); const k=getPeriodKey('daily',d);
    const cnt=Object.keys(state.completions).filter(c=>c.endsWith(`:${k}`)).length;
    let l=''; if(cnt>=8)l='l4';else if(cnt>=5)l='l3';else if(cnt>=2)l='l2';else if(cnt>=1)l='l1';
    hm.innerHTML+=`<div class="heatmap-cell ${l}"></div>`; }
  // Streaks
  const topStreaks=Object.entries(state.streaks).filter(([_,s])=>s.current>0).sort((a,b)=>b[1].current-a[1].current).slice(0,5);
  document.getElementById('desktopStreaks').innerHTML=topStreaks.length?topStreaks.map(([id,s])=>{const t=TASKS.find(x=>x.id===id);const m=getMultiplier(s.current);
    return `<div class="streak-card"><div class="streak-fire-icon">${icon('fire',18)}</div><div class="streak-info"><div class="streak-task-name">${t?t.title:id}</div></div>
    <div class="streak-count">${s.current}</div>${m>1?`<div class="streak-mult">${m}x</div>`:''}</div>`;}).join(''):'<p style="font-size:0.78rem;color:var(--text-muted)">No active streaks yet</p>';
  // Monthly bars
  document.getElementById('desktopMonthlyBars').innerHTML=AREAS.map(area=>{const comp=getAreaCompletion(area.id);
    return `<div class="monthly-area-row">${icon(area.iconKey,20)}<div class="monthly-area-info">
      <div class="monthly-area-name">${area.name}</div>
      <div class="monthly-area-bar"><div class="monthly-area-bar-fill" style="width:${comp.pct}%"></div></div>
    </div><div class="monthly-area-pct">${comp.pct}%</div></div>`;}).join('');
}

function showDesktopAreaDetail(areaId) {
  const area=AREAS.find(a=>a.id===areaId); if(!area) return;
  const xp=state.areaXP[areaId]||0;const level=getLevel(xp);const progress=getLevelProgress(xp);
  const tasks=TASKS.filter(t=>t.areaId===areaId);
  const panel=document.getElementById('desktopAreaDetail');
  document.getElementById('desktopCheckin').classList.add('hidden'); panel.classList.add('active');
  panel.innerHTML=`<div class="area-detail-header"><div class="back-btn" onclick="closeDesktopAreaDetail()">
    <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></div>
    <div><div class="area-detail-title">${icon(area.iconKey,28)} ${area.name}</div>
    <div class="area-detail-level">Level ${level} · ${xp} XP</div></div></div>
    <div class="area-detail-xp-bar"><div class="area-detail-xp-bar-fill" style="width:${progress*100}%"></div></div>
    <div class="area-detail-xp-label">${xpForLevel(level+1)-xp} XP to Level ${level+1}</div>
    <div class="desktop-tasks-scroll">${tasks.map(t=>taskCardHTML(t,area.color)).join('')}</div>`;
}
function closeDesktopAreaDetail() { document.getElementById('desktopAreaDetail').classList.remove('active'); document.getElementById('desktopCheckin').classList.remove('hidden'); }

window.addEventListener('resize',()=>updateUI());

// ===== NAVIGATION =====
function hideAllViews() { document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); }
function switchView(viewId) {
  hideAllViews(); document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById(`view-${viewId}`).classList.add('active');
  const nb=document.querySelector(`[data-view="${viewId}"]`); if(nb) nb.classList.add('active');
  updateUI();
}
document.querySelectorAll('.nav-item').forEach(btn=>btn.addEventListener('click',()=>switchView(btn.dataset.view)));

// ===== INIT =====
updateUI(); renderDashboard();
</script>
